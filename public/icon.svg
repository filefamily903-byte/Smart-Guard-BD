<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2530" />
      <stop offset="50%" stop-color="#0F4C5C" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Outer Protective Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2DD4BF" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Central Shield Container with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <path d="M256 80 L130 136 C130 256 186 352 256 416 C326 352 382 256 382 136 Z" fill="url(#shieldGrad)" stroke="#5EEAD4" stroke-width="6" />

    <!-- Inner Shield Inset -->
    <path d="M256 108 L154 152 C154 248 198 326 256 380 C314 326 358 248 358 152 Z" fill="#064E3B" fill-opacity="0.4" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="3" />
  </g>

  <!-- NFC Wave Arcs Above -->
  <path d="M216 170 A56 56 0 0 1 296 170" fill="none" stroke="#5EEAD4" stroke-width="7" stroke-linecap="round" />
  <path d="M192 144 A88 88 0 0 1 320 144" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.65" />

  <!-- Cultural Kala Dhaga (Black Thread Loop) -->
  <path d="M180 236 C206 280 306 280 332 236" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round" />
  <path d="M180 236 C206 280 306 280 332 236" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6" />

  <!-- Sacred Red Amulet / Knot (Tabiz Bead) -->
  <circle cx="256" cy="265" r="24" fill="#DC2626" stroke="#991B1B" stroke-width="4" />
  <circle cx="250" cy="259" r="6" fill="#FCA5A5" />

  <!-- Center Microchip / Keyhole Graphic -->
  <rect x="242" y="296" width="28" height="34" rx="6" fill="#FFFFFF" />
  <circle cx="256" cy="308" r="4.5" fill="#0F766E" />
  <path d="M256 313 L256 322" stroke="#0F766E" stroke-width="3" stroke-linecap="round" />

  <!-- Little Health Plus Badge at bottom center of shield -->
  <g transform="translate(256, 362)">
    <circle cx="0" cy="0" r="14" fill="#047857" stroke="#34D399" stroke-width="2.5" />
    <path d="M-6 0 L6 0 M0 -6 L0 6" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
